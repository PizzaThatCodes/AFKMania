block_location:
  x: 0
  y: 0
  z: 0
  world: world

afk-message:
  inventory-collect:
    title: "&6AFK Block"
    subtitle: "&aMining Away..."
  inventory-full:
    title: "&6AFK Block"
    subtitle: "&cYour inventory is full"
  leaving-afk:
    title: "&6AFK Block"
    subtitle: "&cYou are no longer AFK mining"
    send-message:
      enabled: true
      message: "%prefix% You are no longer afk mining. You were afk mining for {seconds} seconds."

block_settings:
  original_block: STONE
  block_distance: 6
  break_speed: 1
  hologram:
    - "&6&lAFK BLOCK"
    - "&7Left click to start mining"
    - "&7Right click for upgrades"

# Advanced block table for prison servers.
# Each node can define material, weight, and reward pool.
blocks:
  stone:
    material: STONE
    weight: 35
    rewards: ["tokens_small", "money_small"]
  coal:
    material: COAL_ORE
    weight: 25
    rewards: ["tokens_small", "money_small", "key_frag"]
  diamond:
    material: DIAMOND_ORE
    weight: 10
    rewards: ["tokens_big", "money_big", "crate_key"]

# Weighted reward table. Multiple commands are supported for plugin hook compatibility.
rewards:
  tokens_small:
    chance: 50
    amount: 1
    commands:
      - "eco give %player% 250"
      - "tokens give %player% 5"
  money_small:
    chance: 35
    amount: 1
    commands:
      - "eco give %player% 500"
  key_frag:
    chance: 10
    amount: 1
    commands:
      - "cc give p fragment 1 %player%"
  tokens_big:
    chance: 15
    amount: 1
    commands:
      - "eco give %player% 2000"
      - "tokens give %player% 35"
  money_big:
    chance: 12
    amount: 1
    commands:
      - "eco give %player% 3500"
  crate_key:
    chance: 5
    amount: 1
    commands:
      - "cc give p vote 1 %player%"

gui:
  gui_name: "&8AFK Block Upgrades"
  slot_amount: 27
  slots:
    11:
      item: "BOOK"
      name: "&e&lHow It Works"
      lore:
        - "&7Purchase upgrades and keep mining"
        - "&7while AFK in this area."
      left_click_commands:
        - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP 1 2"
      right_click_commands:
        - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP 1 2"

upgrades:
  fortune:
    name: "&bFortune &7(Level %upgrade_level%)"
    slot: 13
    enabled: true
    item: DIAMOND
    lore:
      - "&7Adds bonus amount to rewards."
      - "&7Current: &f%upgrade_level%"
      - "&7Next Cost: &e$%upgrade_cost%"
      - "&8Max: %upgrade_max_level%"
    chance_per_level: 0
    base_cost: 1000
    incremental_cost: 1500
    max_level: 25
    purchase_commands:
      - "eco take %player% %upgrade_cost%"
    after_purchase_commands:
      - 'tellraw %player% {"text":"Upgraded Fortune to level %next_upgrade_level%!","color":"green"}'
      - "playsound minecraft:entity.player.levelup player %player%"
    maxed_commands:
      - 'tellraw %player% {"text":"This upgrade is already maxed.","color":"red"}'
    proc_commands: []

  keyfinder:
    name: "&dKey Finder &7(Level %upgrade_level%)"
    slot: 14
    enabled: true
    item: TRIPWIRE_HOOK
    lore:
      - "&7Chance to trigger key commands"
      - "&7on each AFK break."
      - "&7Proc Chance: &f%upgrade_level%%"
      - "&7Next Cost: &e$%upgrade_cost%"
    chance_per_level: 1
    base_cost: 3000
    incremental_cost: 3000
    max_level: 100
    purchase_commands:
      - "eco take %player% %upgrade_cost%"
    after_purchase_commands:
      - 'tellraw %player% {"text":"Upgraded Key Finder to level %next_upgrade_level%!","color":"green"}'
    maxed_commands:
      - 'tellraw %player% {"text":"This upgrade is already maxed.","color":"red"}'
    proc_commands:
      - "cc give p minekey 1 %player%"

  haste:
    name: "&6Haste &7(Level %upgrade_level%)"
    slot: 15
    enabled: true
    item: SUGAR
    lore:
      - "&7Reduces AFK block break speed."
      - "&7Current level: &f%upgrade_level%"
      - "&7Next Cost: &e$%upgrade_cost%"
    chance_per_level: 0
    break_speed_reduction_per_level: 0.03
    minimum_break_speed: 0.2
    base_cost: 2000
    incremental_cost: 2500
    max_level: 20
    purchase_commands:
      - "eco take %player% %upgrade_cost%"
    after_purchase_commands:
      - 'tellraw %player% {"text":"Upgraded Haste to level %next_upgrade_level%!","color":"green"}'
    maxed_commands:
      - 'tellraw %player% {"text":"This upgrade is already maxed.","color":"red"}'
    proc_commands: []